# unrelated prose (extension `local://` tool bridges, ACP's writeTextFile, a
# NATS example). The brief said to declare it only if the name is findable
# there, so it is listed here instead of guessed at.
#
# To add it, Tim needs to supply the install id. An OMP extension can arrive
# three ways (reference/omp/marketplace.md, reference/omp/extensions.md):
#   - marketplace plugin  -> a [[plugin]] entry here, as above;
#   - npm package declaring `omp.extensions` in its package.json;
#   - `omp plugin link` of a local checkout.
# Only the first is expressible in this file today. If pi-nvim-bridge is an npm
# package or a local link, this file needs a second entry kind first — agentbox
# reads plugins.toml, so that is an `ab` change, not a profile change.
